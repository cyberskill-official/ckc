[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-knowledge-chain"
version = "1.0.0"
description = "A unified 3-tier chaining workflow for Graphify, GitNexus, and CodeGraph"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
code-chain = "code_chain.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
