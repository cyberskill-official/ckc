name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Configure npm global prefix (no sudo)
        run: |
          mkdir -p "$HOME/.npm-global"
          echo "NPM_CONFIG_PREFIX=$HOME/.npm-global" >> "$GITHUB_ENV"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      - name: Install Python package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Setup engines and sample indexes (--no-ui)
        run: |
          python scripts/setup.py --no-ui

      - name: Run Test Suite
        run: |
          pytest tests -v

      - name: Test Cleanup Script (--all -y)
        run: |
          python scripts/cleanup.py --all -y

      - name: Verify Clean State
        run: |
          # Scrub flaky local/CI artifacts that cleanup should not leave behind
          rm -rf .ruff_cache
          find . -name .DS_Store -delete 2>/dev/null || true
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after cleanup:"
            git status --porcelain
            exit 1
          fi
