name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Test Suite
        run: |
          pytest tests -v

      - name: Test Setup Script (--no-ui)
        run: |
          python scripts/setup.py --no-ui

      - name: Verify Post-Setup Tests
        run: |
          pytest tests -v

      - name: Test Cleanup Script (--all -y)
        run: |
          python scripts/cleanup.py --all -y

      - name: Verify Clean State
        run: |
          git status --porcelain
          # Confirm that cleanup left no untracked or modified files in working directory
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after cleanup:"
            git status --porcelain
            exit 1
          fi
