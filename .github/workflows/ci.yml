name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  lockfile:
    name: uv.lock check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Fail if uv.lock is out of date
        run: uv lock --check

  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Configure npm global prefix (no sudo)
        run: |
          mkdir -p "$HOME/.npm-global"
          echo "NPM_CONFIG_PREFIX=$HOME/.npm-global" >> "$GITHUB_ENV"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      - name: Install Python package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Setup engines and sample indexes (--no-ui)
        run: |
          python scripts/setup.py --no-ui

      - name: Run Test Suite
        run: |
          pytest tests -v --ignore=tests/test_e2e_playwright.py

      - name: Test Cleanup Script (--all -y)
        run: |
          python scripts/cleanup.py --all -y

      - name: Verify Clean State
        run: |
          # Scrub flaky local/CI artifacts that cleanup should not leave behind
          rm -rf .ruff_cache
          find . -name .DS_Store -delete 2>/dev/null || true
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after cleanup:"
            git status --porcelain
            exit 1
          fi

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t ckc:ci .

  e2e-smoke:
    name: Playwright E2E smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with e2e extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,e2e]"
          playwright install --with-deps chromium

      # Server must stay alive in the same step as pytest — GHA tears down
      # background jobs when a step exits (FIND-008 wiring).
      - name: Start UI and run Playwright smoke
        run: |
          set -euo pipefail
          python -m uvicorn code_chain.ui.server:app --host 127.0.0.1 --port 8000 &
          UI_PID=$!
          cleanup() { kill "$UI_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null; then
              break
            fi
            if ! kill -0 "$UI_PID" 2>/dev/null; then
              echo "UI process exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health >/dev/null \
            || { echo "UI failed to become healthy"; exit 1; }
          pytest tests/test_e2e_playwright.py -v -k "TestPageLoad" --tb=short
