<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKC Graph-First Explorer</title>
    <!-- Pinned CDN versions -->
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-cose-bilkent@4.1.0/cytoscape-cose-bilkent.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <div class="logo">CKC Explorer</div>
        <div class="project-input-container">
            <select id="sample-picker" aria-label="Sample projects">
                <option value="">Samples…</option>
            </select>
            <input type="text" id="project-path" placeholder="Enter absolute project path..." />
            <button id="load-btn">Load</button>
        </div>
        <div class="header-badges">
            <span id="ready-badge" class="badge">Not Ready</span>
            <span id="docs-chip" class="badge">Docs: —</span>
            <span id="llm-chip" class="badge">LLM: Off</span>
        </div>
    </header>

    <div class="main-layout">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <section class="filters">
                <h3>Filters</h3>
                <label><input type="checkbox" id="filter-code" checked> Code</label>
                <label><input type="checkbox" id="filter-doc" checked> Docs</label>
                <label><input type="checkbox" id="filter-schema" checked> Schema</label>
                <label><input type="checkbox" id="filter-test" checked> Tests</label>
            </section>
            
            <section class="communities">
                <h3>Communities</h3>
                <ul id="community-list"></ul>
            </section>
            
            <section class="actions">
                <h3>Actions</h3>
                <label><input type="checkbox" id="force-index"> Re-index (force)</label>
                <label><input type="checkbox" id="multimodal-index"> Multimodal</label>
                <button id="run-index-btn">▶ Run Indexing</button>
                <button id="cancel-index-btn" class="hidden">Cancel Indexing</button>
            </section>

            <section class="recent-ops">
                <h3>Recent Operations</h3>
                <div id="ops-history"></div>
            </section>
        </aside>

        <!-- Center Graph Area -->
        <main class="graph-area">
            <div class="command-bar-wrapper">
                <input type="text" id="command-bar" placeholder="Search nodes, ask questions, or analyze symbols... (Press '/')">
                <div class="mode-indicators">
                    <span class="mode-badge" data-mode="query">Query</span>
                    <span class="mode-badge" data-mode="impact">Impact</span>
                    <span class="mode-badge" data-mode="trace">Trace</span>
                </div>
                <button id="clear-overlays-btn" class="hidden">Clear Overlays</button>
            </div>
            
            <div id="cy"></div>
            
            <div class="graph-controls">
                <button id="fit-btn">Fit [f]</button>
            </div>
        </main>

        <!-- Right Panel (Context) -->
        <aside class="right-panel closed" id="context-panel">
            <div class="panel-header">
                <button id="close-panel-btn">×</button>
            </div>
            <div class="panel-content" id="node-details">
                <div class="empty-state">Select a node to view context</div>
                <div class="node-info hidden">
                    <h2 id="node-label"></h2>
                    <span id="node-category" class="badge"></span>
                    <div class="metadata">
                        <div><strong>Source:</strong> <span id="node-source"></span></div>
                        <div><strong>Community:</strong> <span id="node-community"></span></div>
                        <div><strong>Connections:</strong> <span id="node-degree"></span></div>
                    </div>
                    
                    <div class="connections-list" id="node-connections">
                        <!-- Populated dynamically -->
                    </div>

                    <div class="node-actions">
                        <button id="action-impact">▶ Impact Analysis</button>
                        <button id="action-trace">▶ Trace From Here</button>
                        <button id="action-query">▶ Query About This</button>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Bottom Drawer -->
    <div class="bottom-drawer" id="drawer">
        <div class="drawer-header" id="drawer-toggle">
            <div class="drawer-tabs">
                <button class="tab-btn active" data-tab="terminal">Terminal</button>
                <button class="tab-btn" data-tab="results">Results</button>
            </div>
            <div class="drawer-controls">
                <button id="copy-results-btn" class="hidden">Copy Results</button>
                <span class="chevron">▲</span>
            </div>
        </div>
        <div class="drawer-content">
            <div class="tab-pane active" id="pane-terminal">
                <pre id="terminal-output"></pre>
            </div>
            <div class="tab-pane" id="pane-results">
                <div id="results-output" class="markdown-body"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
